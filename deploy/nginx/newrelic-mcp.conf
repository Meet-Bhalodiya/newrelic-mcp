# Replace hostnames and certificate paths. Validate with `nginx -t` before reload.
#
# Rate limiting is enforced here at the edge — this server is designed to run behind a
# reverse proxy. Define the shared zone in the http{} context (e.g. in nginx.conf):
#     limit_req_zone $binary_remote_addr zone=mcp_limit:10m rate=10r/s;
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name newrelic-mcp.example.com;

    ssl_certificate /etc/letsencrypt/live/newrelic-mcp.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/newrelic-mcp.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    client_max_body_size 1m;
    server_tokens off;

    location = /mcp {
        limit_req zone=mcp_limit burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 70s;
        proxy_send_timeout 70s;
    }

    # Required for RFC 9728 discovery when MCP_OIDC_RESOURCE_URL ends in /mcp.
    location = /.well-known/oauth-protected-resource/mcp {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
    }

    location / {
        return 404;
    }
}
