# The upstream active suite includes fixture-specific optional capabilities intended
# for an "everything" server. This server deliberately does not advertise sampling,
# elicitation, completion, logging, subscriptions, or binary/media test fixtures.
# Keeping these as expected failures still runs every active scenario and makes a
# newly passing or newly failing scenario fail CI until this baseline is reviewed.
server:
  - logging-set-level
  - completion-complete
  - tools-call-image
  - tools-call-audio
  - tools-call-embedded-resource
  - tools-call-mixed-content
  - tools-call-with-logging
  - tools-call-with-progress
  - tools-call-sampling
  - tools-call-elicitation
  - elicitation-sep1034-defaults
  - server-sse-multiple-streams
  - elicitation-sep1330-enums
  - resources-read-text
  - resources-read-binary
  - resources-templates-read
  - resources-subscribe
  - resources-unsubscribe
  - prompts-get-simple
  - prompts-get-with-args
  - prompts-get-embedded-resource
  - prompts-get-with-image
